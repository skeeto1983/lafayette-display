<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lafayette Audio Streamer</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>
    <main class="display">

        <header class="lafayette-header">
            <div class="brand">LAFAYETTE</div>
            <div class="subtitle">Network Audio Streamer</div>
        </header>

        <section class="artwork-panel">
            <img
                id="artwork"
                src="/static/images/placeholder.svg"
                alt="Album artwork"
            >
        </section>

        <section class="metadata-panel">
            <div id="source" class="source">
                Lafayette Streamer
            </div>

            <h1 id="title">
                Ready
            </h1>

            <h2 id="artist">
                No artist
            </h2>

            <p id="album" class="album"></p>

            <div class="vu-panel">
                <div class="vu-meter">
                    <div class="vu-label">LEFT</div>

                    <div class="vu-face">
                        <div class="vu-scale">
                            <span>-20</span>
                            <span>-10</span>
                            <span>-5</span>
                            <span>0</span>
                            <span>+3</span>
                        </div>

                        <div id="vu-needle-left" class="vu-needle"></div>
                    </div>
                </div>

                <div class="vu-meter">
                    <div class="vu-label">RIGHT</div>

                    <div class="vu-face">
                        <div class="vu-scale">
                            <span>-20</span>
                            <span>-10</span>
                            <span>-5</span>
                            <span>0</span>
                            <span>+3</span>
                        </div>

                        <div id="vu-needle-right" class="vu-needle"></div>
                    </div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-track">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <div class="time-row">
                    <span id="elapsed">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </section>

        <div id="clock" class="clock"></div>
    </main>

    <script src="/static/js/app.js"></script>
</body>
</html>
