<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Lafayette Audio Streamer</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >
</head>

<body>
    <main class="display">

        <header class="lafayette-header">
            <div class="brand">LAFAYETTE</div>
            <div class="subtitle">Network Audio Streamer</div>
        </header>

        <section class="artwork-panel">
            <img
                id="artwork"
                src="/static/images/placeholder.svg"
                alt="Album artwork"
            >
        </section>

        <section class="metadata-panel">
            <div id="source" class="source">
                Lafayette Streamer
            </div>

            <h1 id="title">
                Ready
            </h1>

            <h2 id="artist">
                No artist
            </h2>

            <p id="album" class="album"></p>

            <div class="vu-panel">
                <div class="vu-meter">
                    <div class="vu-label">LEFT</div>

                    <div class="vu-face">
                        <div class="vu-scale">
                            <span>-20</span>
                            <span>-10</span>
                            <span>-5</span>
                            <span>0</span>
                            <span>+3</span>
                        </div>

                        <div class="vu-ticks">
                            <span class="major" style="--a:-48deg"></span>
                            <span style="--a:-40deg"></span>
                            <span class="major" style="--a:-32deg"></span>
                            <span style="--a:-24deg"></span>
                            <span class="major" style="--a:-16deg"></span>
                            <span style="--a:-8deg"></span>
                            <span class="major" style="--a:0deg"></span>
                            <span style="--a:8deg"></span>
                            <span style="--a:16deg"></span>
                            <span style="--a:24deg"></span>
                            <span style="--a:32deg"></span>
                            <span style="--a:40deg"></span>
                            <span class="major" style="--a:48deg"></span>
                        </div>

                        <div class="vu-mark">VU</div>

                        <div id="vu-needle-left" class="vu-needle"></div>
                    </div>
                </div>

                <div class="vu-meter">
                    <div class="vu-label">RIGHT</div>

                    <div class="vu-face">
                        <div class="vu-scale">
                            <span>-20</span>
                            <span>-10</span>
                            <span>-5</span>
                            <span>0</span>
                            <span>+3</span>
                        </div>

                        <div class="vu-ticks">
                            <span class="major" style="--a:-48deg"></span>
                            <span style="--a:-40deg"></span>
                            <span class="major" style="--a:-32deg"></span>
                            <span style="--a:-24deg"></span>
                            <span class="major" style="--a:-16deg"></span>
                            <span style="--a:-8deg"></span>
                            <span class="major" style="--a:0deg"></span>
                            <span style="--a:8deg"></span>
                            <span style="--a:16deg"></span>
                            <span style="--a:24deg"></span>
                            <span style="--a:32deg"></span>
                            <span style="--a:40deg"></span>
                            <span class="major" style="--a:48deg"></span>
                        </div>
                        
                        <div class="vu-mark">VU</div>

                        <div id="vu-needle-right" class="vu-needle"></div>
                    </div>
                </div>
            </div>

            <div class="progress-container">
                <div class="progress-track">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>

                <div class="time-row">
                    <span id="elapsed">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </section>

        <div id="clock" class="clock"></div>
    </main>
                    <div class="time-row">
                    <span id="elapsed">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
        </section>

        <div id="clock" class="clock"></div>
    </main>

    <!-- Full-screen VU display -->
    <div id="vu-screensaver" class="vu-screensaver hidden">

        <!-- LEFT meter -->
        <div class="vu-screensaver-meter">
            <div class="vu-screensaver-label">LEFT</div>

            <div class="vu-screensaver-face">
                <div class="vu-screensaver-scale">
                    <span style="--a:-48deg; --counter:48deg;"><b>-20</b></span>
                    <span style="--a:-34deg; --counter:34deg;"><b>-10</b></span>
                    <span style="--a:-18deg; --counter:18deg;"><b>-5</b></span>
                    <span style="--a:20deg; --counter:-20deg;"><b>0</b></span>
                    <span style="--a:48deg; --counter:-48deg;"><b>+3</b></span>
                </div>

                <div class="vu-screensaver-ticks">
                    <span class="major" style="--a:-48deg"></span>
                    <span style="--a:-41deg"></span>

                    <span class="major" style="--a:-34deg"></span>
                    <span style="--a:-26deg"></span>

                    <span class="major" style="--a:-18deg"></span>
                    <span style="--a:-8deg"></span>
                    <span style="--a:6deg"></span>

                    <span class="major" style="--a:20deg"></span>
                    <span style="--a:29deg"></span>
                    <span style="--a:38deg"></span>

                    <span class="major" style="--a:48deg"></span>
                </div>

                <div class="vu-screensaver-mark">VU</div>

                <div id="vu-screensaver-left"
                 class="vu-screensaver-needle"></div>
           </div>
        </div>

        <!-- RIGHT meter -->
        <div class="vu-screensaver-meter">
            <div class="vu-screensaver-label">RIGHT</div>

            <div class="vu-screensaver-face">
                <div class="vu-screensaver-scale">
                    <span style="--a:-48deg; --counter:48deg;"><b>-20</b></span>
                    <span style="--a:-34deg; --counter:34deg;"><b>-10</b></span>
                    <span style="--a:-18deg; --counter:18deg;"><b>-5</b></span>
                    <span style="--a:20deg; --counter:-20deg;"><b>0</b></span>
                    <span style="--a:48deg; --counter:-48deg;"><b>+3</b></span>
                </div>

                <div class="vu-screensaver-ticks">
                    <span class="major" style="--a:-48deg"></span>
                    <span style="--a:-40deg"></span>
                    <span class="major" style="--a:-32deg"></span>
                    <span style="--a:-24deg"></span>
                    <span class="major" style="--a:-16deg"></span>
                    <span style="--a:-8deg"></span>
                    <span class="major" style="--a:0deg"></span>
                    <span style="--a:8deg"></span>
                    <span style="--a:16deg"></span>
                    <span style="--a:24deg"></span>
                    <span style="--a:32deg"></span>
                    <span style="--a:40deg"></span>
                    <span class="major" style="--a:48deg"></span>
                </div>

                <div class="vu-screensaver-mark">VU</div>

                <div id="vu-screensaver-right"
                     class="vu-screensaver-needle"></div>
            </div>
        </div>

    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
